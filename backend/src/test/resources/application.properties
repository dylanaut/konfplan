# src/test/resources/application.properties

# 1. Alte, nicht funktionierende Properties entfernen
# quarkus.datasource.jdbc.decorator=p6spy
# quarkus.log.category."p6spy".level=INFO

# 2. Die JDBC-URL so ändern, dass sie 'p6spy' enthält
#    Bisher sah sie vielleicht so aus: jdbc:h2:mem:test
#    Jetzt fügen wir "p6spy:" direkt nach "jdbc:" ein.
quarkus.datasource.db-kind=h2
# WITHOUT P6SPY
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
# USE P6SPY
#quarkus.datasource.jdbc.url=jdbc:p6spy:h2:mem:test;DB_CLOSE_DELAY=-1
#quarkus.datasource.jdbc.driver=com.p6spy.engine.spy.P6SpyDriver
##
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# 3. Das Logging für die Hibernate-Kategorien ist weiterhin nützlich,
#    aber nicht für die Parameter-Anzeige mit P6Spy.
#    Du kannst sie für saubere Logs entfernen oder lassen.
quarkus.hibernate-orm.log.sql=false
#quarkus.hibernate-orm.format-sql=true
quarkus.log.category."p6spy".level=INFO