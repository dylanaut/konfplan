# src/test/resources/spy.properties

# Diese Zeile ist die wichtigste: Sie sagt P6Spy, welcher "echte"
# Datenbanktreiber nach dem Spionieren aufgerufen werden soll.
# Für deine H2-Testdatenbank ist das der H2-Treiber.
realdriver=org.h2.Driver

# Konfiguriert, wie die Logs ausgegeben werden.
# Slf4JLogger leitet die P6Spy-Logs an das normale Quarkus-Logging-System weiter.
# Das ist die sauberste Integration.
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# Definiert, welche Log-Nachrichten du sehen willst. "info" ist gut für SQL.
logMessageFormat=com.p6spy.engine.spy.appender.MultiLineFormat
