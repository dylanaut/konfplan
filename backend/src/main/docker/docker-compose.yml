services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: konfplan
    ports:
      - "5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql   # ← neuer Pfad für PG 18!
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d konfplan" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: konfplan
    ports:
      - "9000:9000"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/konfplan
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: vm4HjK$
    depends_on:
      postgres:
        condition: service_healthy  # Wartet bis DB bereit ist

volumes:
  postgres18-data: