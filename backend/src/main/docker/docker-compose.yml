services:
  sqlserver:
    # HINWEIS: mcr.microsoft.com/azure-sql-edge wurde von Microsoft zum 30.09.2025 offiziell
    # abgekuendigt (keine weiteren Updates/Patches, koennte jederzeit ohne Ankuendigung aus der
    # Registry verschwinden). Es ist aktuell die einzige lokal auf ARM64 (Apple Silicon)
    # lauffaehige SQL-Server-kompatible Option und wird deshalb bewusst trotzdem verwendet.
    # Alternative bei Wegfall: mcr.microsoft.com/mssql/server unter Rosetta-Emulation
    # (amd64-only, langsamer, bekannte AVX-Probleme unter Docker Desktop auf Apple Silicon).
    image: mcr.microsoft.com/azure-sql-edge:latest
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: vm4HjK$$26
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # sqlcmd ist in azure-sql-edge NICHT enthalten. isql (unixODBC, mit dem im Image bereits
      # vorhandenen "ODBC Driver 17 for SQL Server") ist der funktionierende Ersatz. CMD-SHELL
      # laeuft unter /bin/sh (dash) - kein Bash-Here-String "<<<", daher "echo | isql".
      test: [ "CMD-SHELL", "echo 'SELECT 1;' | isql -k 'Driver={ODBC Driver 17 for SQL Server};Server=localhost;Uid=sa;Pwd=vm4HjK$$26;Encrypt=no;' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  db-init:
    # Anders als POSTGRES_DB bei Postgres legt Azure SQL Edge keine benannte Datenbank
    # automatisch an - einmaliger, idempotenter Schritt, der "konfplan" anlegt, bevor
    # Flyway/die App darauf zugreifen. Nutzt dasselbe Image nur als isql-Client (kein
    # eigener SQL-Server-Prozess, Entrypoint wird dafuer ueberschrieben).
    image: mcr.microsoft.com/azure-sql-edge:latest
    entrypoint: [ "sh", "-c" ]
    command:
      - "echo \"IF DB_ID('konfplan') IS NULL CREATE DATABASE konfplan;\" | isql -k 'Driver={ODBC Driver 17 for SQL Server};Server=sqlserver;Uid=sa;Pwd=vm4HjK$$26;Encrypt=no;'"
    depends_on:
      sqlserver:
        condition: service_healthy

  app:
    image: konfplan
    ports:
      - "9000:9000"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=konfplan;encrypt=true;trustServerCertificate=true"
      QUARKUS_DATASOURCE_USERNAME: sa
      QUARKUS_DATASOURCE_PASSWORD: vm4HjK$$26
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
