%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vortragsmanager}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:vm4HjK$}
quarkus.http.port=9000
# Dev Services explizit deaktivieren, falls kein Docker vorhanden ist
quarkus.devservices.enabled=true
quarkus.datasource.devservices.show-logs=true
%dev.vortragsmanager.dev-data.init=true
%dev.vortragsmanager.dev-data.csv-path=src/test/resources/csv_import/bo_26_09
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=db/import-dev.sql
# CORS aktivieren fuer Frontend-Entwicklung auf Port 5173
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
# Flyway Konfiguration
%prod.quarkus.flyway.migrate-at-start=true
# Dev Services Datenbank (mit Testcontainer) anpassen
%dev.quarkus.datasource.devservices.port=65432
# Test Datenbank Konfiguration
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.smallrye-jwt.enabled=false
# Security
quarkus.smallrye-jwt.enabled=true
# JWT signing/verifying
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://vortragsmanager.kreyj
# Test
quarkus.http.test-timeout=60s
# Logging
quarkus.log.category."io.quarkus.rest.request".level=DEBUG
quarkus.http.access-log.enabled=true
# Console-Log (bleibt aktiv)
quarkus.log.console.level=DEBUG

# File-Log zusätzlich aktivieren
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/quarkus.log
quarkus.log.file.level=DEBUG
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.category."org.testcontainers".level=DEBUG
quarkus.log.category."io.quarkus.datasource".level=DEBUG
# Rotation (optional)
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
# HTTP Payload Logging im Dev-Modus
#Build Native
quarkus.native.resources.includes=templates/**,i18n/**
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:23.1.10.0-Final-java21-arm64
quarkus.native.additional-build-args=--parallelism=4,-J-Xmx8g
quarkus.native.container-build=false
quarkus.native.native-image-xmx=8g
# Frontend/Quinoa
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.package-manager=npm
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.build-dir=dist
# Mailer setup (Mailpit must be running - locally)
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.from=juergenkrey@yahoo.de
# App configs
app.templates.external-path=${TEMPLATES_DIR:/Users/kreyj/Java/berufsorientierung/vortragsmanager/templates}
