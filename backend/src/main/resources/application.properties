# ==============================================================================
# GEMEINSAME EIGENSCHAFTEN (fuer alle Profile)
# ==============================================================================
quarkus.application.name=KonfPlan
# Keine quarkus.application.version hier - Quarkus uebernimmt automatisch die Maven-Projektversion.
quarkus.info.enabled=true
quarkus.info.git.enabled=true
quarkus.info.build.enabled=true

# --- HTTP Server ---
#quarkus.http.host=0.0.0.0
quarkus.http.port=9000
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Content-Disposition,X-KonfPlan-Failed-Teilnehmer

# --- Connection-/Thread-Pool-Tuning (Ziel: ~700 gleichzeitige Nutzer, siehe performancetest/) ---
# Postgres-Verbindungen werden je Anfrage nur fuer die kurze Dauer der eigentlichen Hibernate-
# Abfrage gehalten, nicht fuer die gesamte HTTP-Anfrage - ein Pool deutlich kleiner als die
# Nutzerzahl reicht daher, solange die Wartezeit auf einen freien Slot kurz bleibt. max-size ist
# bewusst kleiner als Postgres' Standard-max_connections (100, siehe db/ensure_prod_db.sh), damit
# noch Spielraum fuer Admin-/Monitoring-Verbindungen bleibt.
# initial-size erzwingt den Basisbestand SOFORT beim Start (per Verifikation gegen echtes
# Postgres: min-size allein erstellt ohne initial-size keine Verbindungen im Voraus, sondern
# wirkt nur als Untergrenze, sobald der Pool durch Last bereits gewachsen ist) - erst so wird
# Verbindungsaufbau-Latenz bei den ersten Lastspitzen tatsaechlich vermieden.
quarkus.datasource.jdbc.initial-size=10
quarkus.datasource.jdbc.min-size=10
quarkus.datasource.jdbc.max-size=50
# Statt bei ausgeschoepftem Pool endlos zu blockieren: nach dieser Zeit mit klarem Fehler
# antworten, damit Nutzer eine Rueckmeldung statt eines haengenden Requests bekommen.
quarkus.datasource.jdbc.acquisition-timeout=5s

# Worker-Thread-Pool: fuehrt die blockierenden Hibernate-/JDBC-Aufrufe der REST-Endpunkte aus
# (nicht die nicht-blockierenden Vert.x-Event-Loop-Threads) - bewusst deutlich groesser als
# max-size oben, damit Anfragen, die auf einen freien DB-Pool-Slot warten, nicht zusaetzlich
# durch Thread-Mangel blockieren.
quarkus.thread-pool.max-threads=200

# --- Security & OIDC (Keycloak) ---
# Backend validiert nur noch eingehende Tokens (kein eigenes Login/keine eigene Signatur mehr) -
# Identitaet, Passwoerter und Rollen-Zuweisung liegen komplett bei Keycloak.
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles

# Basis-URL des Frontends fuer Links in E-Mails (z.B. Einladung zu einer Veranstaltung), da diese
# in einer per Nutzer im Browser geoeffneten Seite landen sollen statt direkt im Backend.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# --- Monitoring (Prometheus/Grafana, siehe Monitoring-Grafana.adoc) ---
# Metrics laufen auf einem separaten Management-Port statt dem oeffentlichen App-Port (9000),
# damit /q/metrics nicht versehentlich ueber die oeffentliche URL erreichbar ist. Caddy/die
# Firewall duerfen diesen Port nicht nach aussen routen - Prometheus muss ihn intern erreichen.
quarkus.management.enabled=true
quarkus.management.port=9001

# --- Frontend Integration (Quinoa) ---
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.package-manager=npm
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true


# --- App-spezifische Konfiguration ---
app.templates.external-path=${TEMPLATES_DIR:/Users/kreyj/Java/berufsorientierung/konfplan/templates}
minizinc.path=${MINIZINC_PATH:/opt/homebrew/bin/minizinc}
# Basisverzeichnis fuer den Verzeichnis-Bündel-Import (siehe VeranstaltungImportService):
# jedes Unterverzeichnis darin repräsentiert einen vollständigen CSV-Satz für eine Veranstaltung.
konfplan.veranstaltung-import.base-path=${VERANSTALTUNG_IMPORT_PATH:import/veranstaltungen}
# Datei fuer das News-Laufband auf der Login-Seite: wird alle 5 Minuten vom Frontend abgefragt.
# Existiert die Datei nicht oder ist ihre erste Zeile leer, bleibt das Laufband leer.
konfplan.laufband.path=${LAUFBAND_PATH:laufband.txt}

# ==============================================================================
#                                      P R O D
# ==============================================================================
%prod.quarkus.profile=prod

# --- Datenbank (PostgreSQL) ---
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:konfplan}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.flyway.migrate-at-start=true

# --- Keycloak (OIDC-Verifikation + Admin-Client fuer Nutzer-Provisionierung) ---
%prod.quarkus.oidc.auth-server-url=${KC_SERVER_URL}/realms/${KC_REALM:konfplan}
%prod.quarkus.oidc.client-id=konfplan-backend
%prod.quarkus.keycloak.admin-client.server-url=${KC_SERVER_URL}
%prod.quarkus.keycloak.admin-client.realm=${KC_REALM:konfplan}
%prod.quarkus.keycloak.admin-client.client-id=konfplan-admin-cli
%prod.quarkus.keycloak.admin-client.client-secret=${KC_ADMIN_CLI_SECRET}
%prod.quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# --- Mailer (Brevo) ---
%prod.quarkus.mailer.host=smtp-relay.brevo.com
%prod.quarkus.mailer.port=587
%prod.quarkus.mailer.start-tls=REQUIRED
%prod.quarkus.mailer.username=${BREVO_SMTP_USER}
%prod.quarkus.mailer.password=${BREVO_SMTP_PASSWORD}
%prod.quarkus.mailer.from=juergenkrey@yahoo.de

# --- Logging ---
%prod.quarkus.log.level=INFO
%prod.quarkus.log.file.path=logs/quarkus.log
%prod.quarkus.log.file.rotation.max-file-size=10M
%prod.quarkus.log.file.rotation.max-backup-index=5
%prod.quarkus.http.access-log.enabled=true

# --- Native Build ---
# auf TRUE setzen, damit bei jedem mvn package build auch das ein PROD Image erzeugt wird
%prod.quarkus.native.container-build=false
%prod.quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
%prod.quarkus.native.additional-build-args=--parallelism=4,-J-Xmx8g,--initialize-at-run-time=io.netty.handler.ssl.SslContext,\
io.netty.handler.ssl.JdkSslContext
%prod.quarkus.native.native-image-xmx=8g
%prod.quarkus.native.resources.includes=templates/**,i18n/**

# --- Web Server ---

# 1. Deaktiviert das Caching für die index.html komplett
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=true
# Aktiviert das Umschreiben des Host-Headers (wichtig für CORS/Origins)
quarkus.http.proxy.enable-forwarded-host=true

# 1. Cache komplett verbieten für die Einstiegspunkte (index.html und Root)
quarkus.http.filter.no-cache-index.matches=(/index\.html|/|/index)
quarkus.http.filter.no-cache-index.header."Cache-Control"=no-store, no-cache, must-revalidate
quarkus.http.filter.no-cache-index.methods=GET
quarkus.http.filter.no-cache-index.order=10

# 2. (Optional aber empfohlen) Aggressives Caching für langlebige Quinoa-Assets mit Hash im Namen
quarkus.http.filter.static-assets.matches=/static/.+
quarkus.http.filter.static-assets.header."Cache-Control"=public, max-age=31536000, immutable
quarkus.http.filter.static-assets.methods=GET
quarkus.http.filter.static-assets.order=1

# ==============================================================================
#                                     D E V
# ==============================================================================
%dev.quarkus.profile=dev

# --- Datenbank (PostgreSQL via DevServices) ---
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.show-logs=true
%dev.quarkus.datasource.devservices.port=65432

# --- Keycloak (via DevServices, analog zur Postgres-DevService oben) ---
# Kein auth-server-url gesetzt -> Quarkus startet automatisch einen Keycloak-Dev-Container und
# importiert das unten angegebene Realm (Rollen ADMIN/REFERENT/TEILNEHMER, Clients fuer Frontend
# und Backend, Service-Account-Client fuer den Admin-REST-Client). Fester Port, weil der Browser
# (Frontend-Redirect) die Keycloak-URL direkt kennen muss, nicht nur der Backend-Prozess.
%dev.quarkus.keycloak.devservices.port=8180
%dev.quarkus.keycloak.devservices.realm-path=keycloak/konfplan-realm.json
%dev.quarkus.keycloak.devservices.web-client-timeout=30s
%dev.quarkus.keycloak.devservices.disable-https=true
%dev.quarkus.oidc.client-id=konfplan-backend
%dev.quarkus.keycloak.admin-client.server-url=http://localhost:8180
%dev.quarkus.keycloak.admin-client.realm=konfplan
%dev.quarkus.keycloak.admin-client.client-id=konfplan-admin-cli
%dev.quarkus.keycloak.admin-client.client-secret=dev-secret
%dev.quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# --- Mailpit (via DevServices) ---
# Fester Port, damit die Mailpit-Web-UI beim lokalen Testen von ausgehenden E-Mails immer
# unter derselben Adresse erreichbar ist, statt bei jedem quarkus:dev-Start neu zu wechseln.
%dev.quarkus.mailpit.mapped-http-port=8025

# --- Initialisierungsdaten ---
%dev.konfplan.dev-data.init=true
%dev.konfplan.dev-data.csv-path=src/test/resources/csv_import/
%dev.konfplan.dev-data.datasets=klein
#%dev.quarkus.keycloak.devservices.environment.KC_LOG_LEVEL=debug

#%dev.konfplan.dev-data.datasets=karrierekompass-linz-2026
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

%dev.quarkus.hibernate-orm.sql-load-script=db/import-dev.sql

# --- Frontend Dev Server ---
quarkus.quinoa.dev-server.port=5173

# --- Logging & Debugging ---
%dev.quarkus.transaction-manager.default-transaction-timeout=3m
#%dev.quarkus.log.level=DEBUG
#%dev.quarkus.log.category."io.quarkus.rest.request".level=DEBUG
#%dev.quarkus.log.category."org.testcontainers".level=INFO
#%dev.quarkus.log.category."io.quarkus.datasource".level=DEBUG
#%dev.quarkus.hibernate-orm.log.sql=true
#%dev.quarkus.hibernate-orm.format-sql=true
#%dev.quarkus.log.category."org.hibernate.type.descriptor.sql.BasicBinder".level=TRACE
