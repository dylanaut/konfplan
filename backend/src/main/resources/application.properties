quarkus.http.port=9000

quarkus.datasource.db-kind=sqlite
quarkus.datasource.username=root
#quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:sqlite:vortragsmanager.db
quarkus.hibernate-orm.database.generation=update
# WICHTIG für SQLite: Fremdschlüssel-Unterstützung aktivieren
quarkus.datasource.jdbc.additional-jdbc-properties.foreign_keys=true
quarkus.datasource.jdbc.min-size=1



# Security
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.issuer=https://event-planner.kreyj
# Fuer Entwicklung: Symmetrischer Key (32+ Zeichen)
smallrye.jwt.sign.key=dies-ist-ein-sehr-geheimer-schluessel-fuer-jwt

# Wo liegt der Frontend-Quellcode (relativ zum Backend-Projektpfad)?
quarkus.quinoa.ui-dir=../frontend

# Welchen Package-Manager nutzen wir?
quarkus.quinoa.package-manager=npm

# Im Entwicklungsmodus (mvn quarkus:dev):
# Quinoa startet automatisch den Vite-Dev-Server und leitet Anfragen weiter
quarkus.quinoa.dev-server.port=5173

# Im Produktionsmodus (Build):
# Wo liegen die fertigen Dateien nach 'npm run build'? (Standard bei Vite ist 'dist')
quarkus.quinoa.build-dir=dist

# Optional: Leitet alle 404-Anfragen an die index.html weiter (Wichtig für Vue Router!)
quarkus.quinoa.history-navigation=true

# Mail-Konfiguration (Beispiel Mailtrap für Tests)
quarkus.mailer.host=sandbox.smtp.mailtrap.io
quarkus.mailer.port=2525
quarkus.mailer.username=ihr_username
quarkus.mailer.password=ihr_passwort
quarkus.mailer.from=noreply@vortragsmanager.de