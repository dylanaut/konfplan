# ==============================================================================
#                                     T E S T
# ==============================================================================
%test.quarkus.profile=test

# --- Datenbank (H2 In-Memory) ---
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1

# --- Flyway deaktivieren ---
%test.quarkus.flyway.enabled=false

# --- Mailer mocken ---
%test.quarkus.mailer.mock=true

# --- Security fuer Tests ---
# Tests nutzen @TestSecurity/@OidcSecurity, um eine SecurityIdentity direkt zu injizieren, statt
# echt gegen Keycloak zu pruefen. quarkus.oidc.enabled=false wuerde auch die CDI-Producer fuer
# JsonWebToken abschalten (viele Resources injizieren das direkt) - daher bleibt die Extension
# "aktiv", bekommt aber eine dummy auth-server-url, damit keine Dev-Services-Testcontainer starten.
%test.quarkus.oidc.auth-server-url=http://localhost:8180/realms/konfplan
%test.quarkus.oidc.client-id=konfplan-backend
# Nur fuer die CDI-Bean-Erzeugung des Keycloak-Admin-Clients benoetigt - echte Aufrufe werden in
# Tests, die Nutzer anlegen, per @InjectMock KeycloakUserProvisioningService unterbunden.
%test.quarkus.keycloak.admin-client.server-url=http://localhost:8180
%test.quarkus.keycloak.admin-client.realm=konfplan
%test.quarkus.keycloak.admin-client.client-id=konfplan-admin-cli
%test.quarkus.keycloak.admin-client.client-secret=test-secret
%test.quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# --- Monitoring: Management-Port in Tests nicht binden (nicht benoetigt) ---
%test.quarkus.management.enabled=false

# --- Test-Timeouts ---
%test.quarkus.http.test-timeout=60s
%test.quarkus.transaction-manager.default-transaction-timeout=600

# --- Verzeichnis-Bündel-Import: eigene Test-Fixtures statt Produktionspfad ---
%test.konfplan.veranstaltung-import.base-path=src/test/resources/veranstaltung_import_bundles/

# --- Laufband: Pfad unter target/, damit Tests die Datei frei an-/ablegen koennen ---
%test.konfplan.laufband.path=target/laufband-test/laufband.txt

