# ==============================================================================
#                                     T E S T
# ==============================================================================
%test.quarkus.profile=test

# --- Datenbank (H2 In-Memory) ---
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1

# --- Flyway deaktivieren ---
%test.quarkus.flyway.enabled=false

# --- Mailer mocken ---
%test.quarkus.mailer.mock=true

# --- Security fuer Tests ---
%test.quarkus.smallrye-jwt.enabled=false

# --- Test-Timeouts ---
%test.quarkus.http.test-timeout=60s
%test.quarkus.transaction-manager.default-transaction-timeout=600

# --- Verzeichnis-Bündel-Import: eigene Test-Fixtures statt Produktionspfad ---
%test.konfplan.veranstaltung-import.base-path=src/test/resources/veranstaltung_import_bundles/

