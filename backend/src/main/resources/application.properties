quarkus.http.port=9000
# CORS aktivieren fuer Frontend-Entwicklung auf Port 5173
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
# Datenbank Konfiguration (Standard: PostgreSQL)
%prod.quarkus.datasource.username=${DB_USER:vortragsmanager}
%prod.quarkus.datasource.password=${DB_PASSWORD:secret}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vortragsmanager}
%prod.quarkus.datasource.jdbc.max-size=10

# Test Datenbank Konfiguration
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Dev-Modus: Nutzt standardm‰ﬂig Postgres Dev Services (Docker)
quarkus.datasource.devservices.port=65432
%dev.quarkus.hibernate-orm.sql-load-script=db/import-dev.sql
%dev.quarkus.transaction-manager.default-transaction-timeout=3600

%dev.vortragsmanager.dev-data.init=true
%dev.vortragsmanager.dev-data.csv-path=src/test/resources/csv_import/bo_26_09

# Flyway Konfiguration
#quarkus.flyway.migrate-at-start=false
# Hibernate Konfiguration
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
#%dev.quarkus.hibernate-orm.schema-management.strategy=update
#%dev.quarkus.hibernate-orm.log.sql=true
%prod.quarkus.hibernate-orm.schema-management.strategy=update
# Security
quarkus.smallrye-jwt.enabled=true
# JWT signing/verifying
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://vortragsmanager.kreyj
# Test
quarkus.http.test-timeout=60s
%test.quarkus.hibernate-orm.sql-load-script=no-file
# Logging
quarkus.log.category."io.quarkus.rest.request".level=DEBUG
quarkus.http.access-log.enabled=true
# HTTP Payload Logging im Dev-Modus
%dev.quarkus.log.category."kreyj.vortragsmanager.resource".level=DEBUG
%dev.quarkus.log.category."kreyj.vortragsmanager.service".level=DEBUG
# Frontend/Quinoa
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.package-manager=npm
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.build-dir=dist
quarkus.quinoa.history-navigation=true
# Mailer setup (Mailpit must be running - locally)
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.from=juergenkrey@yahoo.de
