<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <style>
        body { font-family: sans-serif; font-size: 11pt; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 6px 10px; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>
    <h2>Temporäre Passwörter – {veranstaltungName}</h2>
    <p>Erzeugt am {erzeugtAm}. Jeder Teilnehmer muss beim ersten Login sein eigenes Passwort setzen.</p>
    <table>
        <thead>
        <tr><th>Name</th><th>Login</th><th>Temporäres Passwort</th></tr>
        </thead>
        <tbody>
        {#for eintrag in eintraege}
        <tr><td>{eintrag.fullName}</td><td>{eintrag.loginName}</td><td>{eintrag.password}</td></tr>
        {/for}
        </tbody>
    </table>
</body>
</html>
