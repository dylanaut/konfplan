quarkus.http.port=9000
# CORS aktivieren fuer Frontend-Entwicklung auf Port 5173
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization
# Datenbank Konfiguration (PROD mit PostgreSQL)
%prod.quarkus.datasource.default.db-kind=postgresql
%prod.quarkus.datasource.default.username=${DB_USER:konfplan}
%prod.quarkus.datasource.default.password=${DB_PASSWORD:vm4HjK$}
%prod.quarkus.datasource.default.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:konfplan}
%prod.quarkus.datasource.default.jdbc.driver=org.postgresql.Driver
%prod.quarkus.datasource.default.jdbc.min-size=2
%prod.quarkus.datasource.default.jdbc.max-size=10
%prod.quarkus.hibernate-orm.schema-management.strategy=none
# Flyway Konfiguration
%prod.quarkus.flyway.migrate-at-start=true
#
# Datenbank Konfiguration Dev-Modus
%dev.quarkus.datasource.devservices.port=65432
%dev.quarkus.hibernate-orm.sql-load-script=db/import-dev.sql
%dev.quarkus.transaction-manager.default-transaction-timeout=3600
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
#%dev.quarkus.hibernate-orm.log.sql=true
%dev.konfplan.dev-data.init=true
%dev.konfplan.dev-data.csv-path=src/test/resources/csv_import/bo_26_09
#
# Datenbank Konfiguration Test-Modues
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
# Hibernate Konfiguration
# Security
quarkus.smallrye-jwt.enabled=true
# JWT signing/verifying
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://konfplan.kreyj
# Test
quarkus.http.test-timeout=60s
%test.quarkus.hibernate-orm.sql-load-script=no-file
# Logging
quarkus.log.category."io.quarkus.rest.request".level=DEBUG
quarkus.http.access-log.enabled=true
%dev.quarkus.log.category."com.fasterxml.jackson".level=DEBUG
%dev.quarkus.log.category."org.jboss.resteasy.reactive.server.handlers.ParameterHandler".level=DEBUG
# HTTP Payload Logging im Dev-Modus
%dev.quarkus.log.category."kreyj.konfplan.resource".level=DEBUG
%dev.quarkus.log.category."kreyj.konfplan.service".level=DEBUG
#Build Native
quarkus.native.resources.includes=templates/**,i18n/**
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:23.1.10.0-Final-java21-arm64
quarkus.native.additional-build-args=--parallelism=4,-J-Xmx8g
#quarkus.native.container-build=true
quarkus.native.native-image-xmx=8g
# Frontend/Quinoa
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.package-manager=npm
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.build-dir=dist
quarkus.quinoa.history-navigation=true
# Mailer setup (Mailpit must be running - locally)
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.from=juergenkrey@yahoo.de
