name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub-Runner haben freien Internetzugang - anders als der bisherige
  # (Corporate-Netzwerk-)Runner brauchen wir hier NICHT den internen Nexus-Mirror
  # aus frontend/.npmrc, sondern können direkt gegen den öffentlichen npm-Registry bauen.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (Backend + Frontend via Quinoa)
        # -Pbuild-user-manuals rendert die Benutzerhandbücher (Admin/Referent/Teilnehmer) als PDF
        # direkt in META-INF/resources/handbuecher, sodass sie im Anwendungs-Jar landen und über
        # das Info-Menü herunterladbar sind (siehe backend/pom.xml).
        run: ./mvnw --batch-mode clean install -DskipTests -Pbuild-user-manuals

      - name: Install MiniZinc
        env:
          # GitHub-Runner teilen sich IP-Adressen - das unauthentifizierte Rate-Limit fuer
          # api.github.com (60 Anfragen/Stunde PRO IP) kann dadurch von anderen Workflows/Kunden
          # aufgebraucht sein. Mit dem automatisch bereitgestellten GITHUB_TOKEN steigt das Limit
          # auf 5000/Stunde, gebunden an diesen Workflow-Lauf statt an die Runner-IP.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Matcht sowohl das alte ("...-bundle-linux-x86_64.tgz", vor MiniZinc 2.10) als auch das
          # aktuelle Namensschema ("...-x86_64-linux-gnu.tgz", ab 2.10.1) - live beobachtet: CI
          # schlug fehl, weil MiniZinc das Release-Asset umbenannt hat und das alte, zu enge
          # Pattern dadurch ins Leere lief (nicht am Rate-Limit gescheitert - der identische
          # curl-Aufruf lief vom lokalen Rechner aus anstandslos durch, nur eben ohne Treffer).
          ASSET_URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/MiniZinc/MiniZincIDE/releases/latest \
            | grep -oE '"browser_download_url": *"[^"]*(x86_64-linux-gnu|bundle-linux-x86_64)\.tgz"' \
            | head -1 | cut -d '"' -f4)
          if [[ -z "$ASSET_URL" ]]; then
            echo "Konnte keinen passenden MiniZinc-Linux-Release-Asset ermitteln." >&2
            exit 1
          fi
          echo "Lade MiniZinc von $ASSET_URL"
          curl -fsSL -o /tmp/minizinc.tgz "$ASSET_URL"
          mkdir -p "$HOME/minizinc"
          tar -xzf /tmp/minizinc.tgz -C "$HOME/minizinc" --strip-components=1
          "$HOME/minizinc/bin/minizinc" --version
          echo "MINIZINC_PATH=$HOME/minizinc/bin/minizinc" >> "$GITHUB_ENV"

      - name: Run backend tests
        run: cd backend && ../mvnw --batch-mode test

      - name: Upload backend build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: backend-target
          path: backend/target/
          retention-days: 1

  package:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download backend build artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-target
          path: backend/target/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: image_tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v*.*.* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "ghcr.io/${{ github.repository }}:${VERSION}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "ghcr.io/${{ github.repository }}:${{ github.sha }}"
              echo "ghcr.io/${{ github.repository }}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # Kontext ist 'backend', da Dockerfile.jvm relativ zu 'target/quarkus-app/...' kopiert.
          context: backend
          file: backend/src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
