name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub-Runner haben freien Internetzugang - anders als der bisherige
  # (Corporate-Netzwerk-)Runner brauchen wir hier NICHT den internen Nexus-Mirror
  # aus frontend/.npmrc, sondern können direkt gegen den öffentlichen npm-Registry bauen.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (Backend + Frontend via Quinoa)
        run: ./mvnw --batch-mode clean install -DskipTests

      - name: Install MiniZinc
        run: |
          set -euo pipefail
          ASSET_URL=$(curl -fsSL https://api.github.com/repos/MiniZinc/MiniZincIDE/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*bundle-linux-x86_64\.tgz"' \
            | head -1 | cut -d '"' -f4)
          if [[ -z "$ASSET_URL" ]]; then
            echo "Konnte keinen passenden MiniZinc-Linux-Release-Asset ermitteln." >&2
            exit 1
          fi
          echo "Lade MiniZinc von $ASSET_URL"
          curl -fsSL -o /tmp/minizinc.tgz "$ASSET_URL"
          mkdir -p "$HOME/minizinc"
          tar -xzf /tmp/minizinc.tgz -C "$HOME/minizinc" --strip-components=1
          "$HOME/minizinc/bin/minizinc" --version
          echo "MINIZINC_PATH=$HOME/minizinc/bin/minizinc" >> "$GITHUB_ENV"

      - name: Run backend tests
        run: cd backend && ../mvnw --batch-mode test

      - name: Upload backend build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: backend-target
          path: backend/target/
          retention-days: 1

  package:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download backend build artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-target
          path: backend/target/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # Kontext ist 'backend', da Dockerfile.jvm relativ zu 'target/quarkus-app/...' kopiert.
          context: backend
          file: backend/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
