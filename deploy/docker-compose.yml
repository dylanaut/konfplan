# Docker-Compose-Deployment für KonfPlan (App + PostgreSQL + Keycloak + optional Caddy/Mailpit).
#
# Funktioniert identisch lokal (macOS + UTM-VM) und auf einem Cloud-Host (z.B. Hetzner) - der
# Unterschied steckt ausschließlich in deploy/.env (siehe .env.example) und dem aktivierten
# Compose-Profile "public", nicht in dieser Datei.
#
# App und Keycloak sind standardmäßig nur an 127.0.0.1 gebunden (sicher per Default: von außen
# nicht erreichbar, lokal per "http://localhost:9000" trotzdem nutzbar) - Caddy erreicht beide
# unabhängig von der Host-Portbindung immer intern über den Compose-Service-Namen.
#
#   (kein Profil) - lokal/UTM: App+Keycloak per "http://localhost:<port>" erreichbar, kein TLS
#                   (kein öffentlicher Host, daher auch keine Let's-Encrypt-Zertifikate möglich).
#   public         - Hetzner/Internet: zusätzlich Caddy als TLS-Reverse-Proxy (automatisches
#                    Let's Encrypt, Ports 80/443 öffentlich gebunden).
#   mailpit        - zusätzlich Mailpit statt echtem SMTP (z.B. Brevo) - für Staging/Tests ohne
#                    echten Mailversand.
#   monitoring     - zusätzlich Prometheus+Grafana zur Visualisierung der App-Metriken
#                    (siehe Monitoring-Grafana.adoc). Beide nur an 127.0.0.1 gebunden - Zugriff
#                    bei einem reinen SSH-verwalteten Server per Tunnel (siehe Doku), nie
#                    öffentlich über Caddy geroutet.
#   alerting       - zusätzlich ein Sidecar, der das "app"-Log auf ERROR-Zeilen ueberwacht und
#                    per ntfy.sh eine Push-Benachrichtigung schickt (siehe
#                    Deployment-DockerCompose.adoc -> "App-Log auf ERROR ueberwachen").
#
# Passwörter kommen NIE aus dieser Datei oder aus .env, sondern aus Docker-Compose-File-Secrets
# (secrets/*.txt, von bootstrap.sh serverseitig generiert, siehe Deployment.adoc).

secrets:
  db_password:
    file: ./secrets/db_password.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
  keycloak_admin_cli_secret:
    file: ./secrets/keycloak_admin_cli_secret.txt
  brevo_smtp_password:
    file: ./secrets/brevo_smtp_password.txt

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:

services:

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: konfplan
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # Postgres 18+ erwartet den Mount-Punkt eine Ebene hoeher als frueher (legt selbst einen
      # Major-Version-Unterordner an), siehe offizielle Postgres-Docker-Doku.
      - postgres-data:/var/lib/postgresql
      # Legt zusaetzlich die "keycloak"-Datenbank an (nur beim allerersten Start mit leerem
      # Datenverzeichnis - der offizielle Postgres-Entrypoint fuehrt *.sql hier nur einmalig aus).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: postgres
      # KC_HOSTNAME als volle URL (Keycloak-26-"Hostname v2") statt nur Hostname - so kann
      # Keycloak unter einem Pfad-Praefix auf derselben Domain wie die App laufen (kein
      # eigener A-Record fuer Keycloak noetig). KC_HTTP_RELATIVE_PATH sorgt dafuer, dass
      # Keycloak intern selbst unter genau diesem Pfad served - Caddy muss den Pfad dadurch
      # nicht umschreiben (siehe Caddyfile).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080/auth}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: "false"
      # Caddy (Profil "public") terminiert TLS und spricht Keycloak intern per HTTP an. Ohne
      # Caddy (lokal/UTM) wird Keycloak stattdessen direkt per HTTP erreicht.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Healthcheck unten fragt Keycloaks Management-Interface ab - ohne diese Variable
      # existiert der /health/ready-Endpunkt dort nicht.
      KC_HEALTH_ENABLED: "true"
    secrets:
      - db_password
      - keycloak_admin_password
    volumes:
      # Realm-Import: von bootstrap.sh aus keycloak-realm.template.json generiert (enthaelt das
      # tatsaechliche Admin-CLI-Client-Secret, daher nicht im Repo, siehe .gitignore).
      - ./keycloak-realm.generated.json:/opt/keycloak/data/import/konfplan-realm.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)" &&
        export KC_DB_PASSWORD="$$(cat /run/secrets/db_password)" &&
        exec /opt/keycloak/bin/kc.sh start --import-realm
    ports:
      - "${KEYCLOAK_PORT_BINDING:-127.0.0.1:8080:8080}"
    healthcheck:
      # Das Keycloak-Image enthaelt weder curl noch wget (minimales UBI9-Basisimage), aber bash -
      # daher der rohe /dev/tcp-HTTP-Request statt eines HTTP-Clients. Ohne diesen Healthcheck
      # startet "app" parallel zu Keycloak statt zu warten, bis dessen Port tatsaechlich lauscht
      # (beobachtet: ProdKeycloakRealmSyncService lief beim Boot gegen ein noch nicht erreichbares
      # Keycloak, "Connection refused" - einmalig ohne Retry, wodurch u.a. die view-events-Rolle
      # dauerhaft fehlte und der FailedLoginMetricsPoller seitdem mit 403 fehlschlug).
      # KC_HTTP_RELATIVE_PATH (/auth) gilt live-verifiziert (Keycloak 26.5) auch fuer das
      # Management-Interface, nicht nur fuer die Haupt-HTTP-Schnittstelle - ohne das
      # "/auth"-Praefix hier liefert der Endpunkt 404 statt 200 (der Healthcheck lief deshalb
      # dauerhaft ins "unhealthy", obwohl Keycloak selbst laengst fertig gestartet war).
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q "200"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    image: ghcr.io/dylanaut/konfplan:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: konfplan
      DB_USER: postgres
      KC_SERVER_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/auth}
      KC_REALM: konfplan
      FRONTEND_BASE_URL: ${APP_PUBLIC_URL:-http://localhost:9000}
      # Nur relevant, wenn Profil "mailpit" NICHT aktiv ist (echter SMTP-Versand, z.B. Brevo).
      BREVO_SMTP_USER: ${BREVO_SMTP_USER:-}
      QUARKUS_MAILER_HOST: ${MAILER_HOST:-mailpit}
      QUARKUS_MAILER_PORT: ${MAILER_PORT:-1025}
      QUARKUS_MAILER_START_TLS: ${MAILER_START_TLS:-DISABLED}
      # App und Keycloak liegen hinter Caddy (einzige Domain, siehe Caddyfile). Ohne diese vier
      # Einstellungen vertraut Quarkus den X-Forwarded-*-Headern nicht und erkennt Schema/Host/IP
      # der ursprünglichen Anfrage nicht korrekt - das äußert sich nicht als offensichtlicher
      # Fehler, sondern als schwer diagnostizierbarer Folgefehler (in der Praxis beobachtet: eine
      # Keycloak-Required-Action wie "Update Password" griff beim Login nicht).
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
      QUARKUS_HTTP_PROXY_ALLOW_FORWARDED: "true"
      QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_HOST: "true"
      # News-Laufband auf der Login-Seite: optional, siehe ./data/laufband.txt weiter unten.
      LAUFBAND_PATH: /var/lib/konfplan/laufband.txt
    secrets:
      - db_password
      - keycloak_admin_cli_secret
      - brevo_smtp_password
    volumes:
      # Verzeichnis auf dem Host, in das Admins z.B. laufband.txt legen koennen, ohne den
      # Container neu zu bauen - wird bei jedem Request neu gelesen (siehe LaufbandResource).
      - ./data:/var/lib/konfplan
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        export DB_PASSWORD="$$(cat /run/secrets/db_password)" &&
        export KC_ADMIN_CLI_SECRET="$$(cat /run/secrets/keycloak_admin_cli_secret)" &&
        export BREVO_SMTP_PASSWORD="$$(cat /run/secrets/brevo_smtp_password)" &&
        exec /opt/jboss/container/java/run/run-java.sh
    ports:
      - "${APP_PORT_BINDING:-127.0.0.1:9000:9000}"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    profiles: ["mailpit"]

  # Container-Uptime/-Restarts (siehe Monitoring-Grafana.adoc) - Docker Compose selbst liefert
  # dafuer keine Prometheus-Metriken, cAdvisor liest sie direkt aus den Docker-/Cgroup-Daten des
  # Hosts. Nur lesende Mounts, kein "privileged" - reicht fuer Start-/Laufzeit-Metriken.
  cadvisor:
    # Ab v0.53.0 zog das Image von gcr.io/cadvisor/cadvisor zu ghcr.io/google/cadvisor um (siehe
    # cAdvisor-README). v0.49.1 lieferte auf Docker-Setups mit dem neueren containerd-Snapshotter
    # (Storage Driver "overlayfs", driver-type "io.containerd.snapshotter.v1" - inzwischen der
    # Standard bei aktuellem Docker Engine) ueberhaupt keine Container-Metriken: die Docker-Factory
    # meldete sich zwar erfolgreich an, aber die Layer-ID-Aufloesung schlug fuer JEDEN Container
    # fehl ("failed to identify the read-write layer ID"), wodurch /metrics nur rohe Root-Cgroups
    # zeigte statt einzelner Container mit Namen/Labels - bekannter, gefixter cAdvisor-Bug
    # (google/cadvisor#3643/#3860, Fix in PR #3709, ausgeliefert ab v0.54.0). Mind. v0.54.0 nutzen.
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      # Expliziter Socket-Mount statt des ganzen /var/run-Verzeichnisses - live getestet: ohne
      # den direkten Socket-Mount registriert cAdvisors Docker-Factory NICHT ("Cannot connect to
      # the Docker daemon"), wodurch alle Metriken nur die rohen Cgroups zeigen statt einzelner
      # Container mit Namen/Labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_PORT_BINDING:-127.0.0.1:8081:8080}"
    profiles: ["monitoring"]

  prometheus:
    image: prom/prometheus:v3.9.1
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT_BINDING:-127.0.0.1:9090:9090}"
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Erster Login: admin / admin - Grafana selbst erzwingt eine Passwortaenderung beim ersten
      # Login. Kein eigenes Docker-Secret, da Grafana ausschliesslich per 127.0.0.1-Bindung +
      # SSH-Tunnel erreichbar ist (siehe Monitoring-Grafana.adoc), nie oeffentlich exponiert.
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT_BINDING:-127.0.0.1:3000:3000}"
    profiles: ["monitoring"]

  # Beobachtet "docker logs -f" des "app"-Containers laufend und meldet jede ERROR-Zeile per
  # ntfy.sh (siehe deploy/error-log-notifier.sh) - Echtzeit-Alarm zusaetzlich zu Prometheus/
  # Grafana, das im Stack keinen Alertmanager hat und daher selbst nichts meldet. Nur lesender
  # Docker-Socket-Mount, kein "privileged" - reicht, um Logs eines anderen Containers zu lesen.
  error-log-notifier:
    image: docker:27-cli
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NTFY_ERROR_TOPIC: ${NTFY_ERROR_TOPIC:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./error-log-notifier.sh:/usr/local/bin/error-log-notifier.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/error-log-notifier.sh"]
    profiles: ["alerting"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
      - keycloak
    environment:
      # Werden von bootstrap.sh vor "docker compose --profile public up" geprueft (Compose
      # evaluiert ${VAR:?} leider fuer JEDEN Service beim Parsen, auch fuer inaktive Profile -
      # eine harte Pflicht-Variable hier wuerde daher auch den lokalen/UTM-Fall ohne Caddy brechen).
      APP_HOSTNAME: ${APP_HOSTNAME:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    profiles: ["public"]
