<svg viewBox="0 0 500 500" width="450" height="450" xmlns="http://www.w3.org/2000/svg">
    <!-- Hintergrund (Dark Mode) -->
    <rect width="100%" height="100%" fill="#121214" rx="16"/>

    <!-- BILDMARKE: Das gestapelte Code-Zelt (msg-Lila-Verlauf) -->
    <g id="code-tent" transform="translate(0, -10)">
        <defs>
            <linearGradient id="msg-purple-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="#6A1A7D" />
                <stop offset="100%" stop-color="#A246B9" />
            </linearGradient>
        </defs>

        <!-- Stufe 1: Basis (Konzept) -->
        <path d="M 170 230 L 330 230 L 310 200 L 190 200 Z" fill="url(#msg-purple-gradient)" />
        <!-- Stufe 2: Architektur (Backend) -->
        <path d="M 195 194 L 305 194 L 285 164 L 215 164 Z" fill="url(#msg-purple-gradient)" opacity="0.9" />
        <!-- Stufe 3: Interface (Frontend) -->
        <path d="M 220 158 L 280 158 L 265 128 L 235 128 Z" fill="url(#msg-purple-gradient)" opacity="0.8" />
        <!-- Stufe 4: Spitze (Deployment) -->
        <path d="M 240 122 L 260 122 L 250 92 Z" fill="url(#msg-purple-gradient)" opacity="0.7" />

        <!-- Progressiver Aufwärtspfeil (Negativraum / Weiß) -->
        <path d="M 244 240 L 256 240 L 256 140 L 264 140 L 250 115 L 236 140 L 244 140 Z" fill="#121214" />
        <path d="M 244 240 L 256 240 L 256 140 L 264 140 L 250 115 L 236 140 L 244 140 Z" fill="#FFFFFF" opacity="0.15" />
    </g>

    <!-- TYPOGRAFIE: Name & Slogan -->
    <g id="branding" text-anchor="middle">
        <!-- Hauptname: SE CAMP -->
        <text x="250" y="315" fill="#FFFFFF" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="42" font-weight="800" letter-spacing="4">SE Camp</text>

        <!-- Dekorationslinie -->
        <line x1="200" y1="345" x2="300" y2="345" stroke="#6A1A7D" stroke-width="3" stroke-linecap="round" />

        <!-- Slogan: Gemeinsam. Besser. Entwickeln. -->
        <text x="250" y="390" fill="#E2E8F0" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="18" font-weight="500" letter-spacing="1">Gemeinsam. Besser. Entwickeln.</text>
    </g>
</svg>
